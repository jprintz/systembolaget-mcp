name: live

# Daily run against the real Systembolaget API: an early warning when
# systembolaget.se or its API changes (GitHub emails you when this fails).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m live
