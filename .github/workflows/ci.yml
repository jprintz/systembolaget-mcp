name: ci

# Tests on every push and pull request. Images go to GHCR from main
# (ghcr.io/jprintz/systembolaget-mcp:main and :sha-<commit>) and from version
# tags (v0.2.0 -> :0.2.0, :0.2). The VPS pins version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: systembolaget-mcp:test

      - name: Smoke test (MCP initialize + tools/list over HTTP)
        run: |
          docker run -d --name smoke --read-only --cap-drop ALL -p 8000:8000 systembolaget-mcp:test
          for _ in $(seq 1 20); do docker exec smoke systembolaget-mcp --healthcheck && break; sleep 1; done
          headers=(-H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "Host: mcp.example.com")
          curl -fsS "${headers[@]}" http://127.0.0.1:8000/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | tee /dev/stderr | grep -q '"serverInfo"'
          curl -fsS "${headers[@]}" -H "MCP-Protocol-Version: 2025-06-18" http://127.0.0.1:8000/mcp \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | grep -q systembolaget_get_product
          docker rm -f smoke

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build and push (amd64 + arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
